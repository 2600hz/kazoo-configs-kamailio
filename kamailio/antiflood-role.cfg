######## Antiflood ########
## Request rate (pike): ANTIFLOOD_RATE_* per source IP.
## Auth failures, per user::ip (ANTIFLOOD_FAILED_AUTH_*):
##   - only real failures count: a stale or reused nonce and missing credentials
##     just get a new challenge;
##   - DENSITY failures within WINDOW ban the key for BAN_BASE seconds; a request
##     during the ban is refused and extends it by its current length
##     (Retry-After: that length); after the ban, the next failure bans again
##     for FACTOR times longer (no ceiling with BAN_MAX 0); the length is
##     remembered LEVEL_MEMORY seconds after the ban ends.
## Reset through the API: a crossbar registrations flush (reg_flush over AMQP)
##   clears it, for a device (DELETE /v2/accounts/{ACCOUNT_ID}/registrations/
##   {USERNAME}, or saving the device) or a whole account (DELETE
##   /v2/accounts/{ACCOUNT_ID}/registrations). A successful authentication
##   clears it too. Current state: kamcmd htable.dump antiflood / antiflood_level.

#!trydef ANTIFLOOD_RATE_WINDOW 2
#!trydef ANTIFLOOD_RATE_DENSITY 50
#!trydef ANTIFLOOD_RATE_EXPIRE 4
## auth failures count for an hour (WINDOW and the antiflood table's CACHE_PERIOD
## go together): a source pacing its tries slower than the window is never seen
#!trydef ANTIFLOOD_FAILED_AUTH_WINDOW 3600
#!trydef ANTIFLOOD_FAILED_AUTH_DENSITY 4
## the source port stays out of the key: a new port per try would be a new key
#!trydef ANTIFLOOD_FAILED_AUTH_USE_PORT 0
#!trydef ANTIFLOOD_FAILED_AUTH_ACTION 2
#!trydef ANTIFLOOD_RATE_LIMIT_ENABLED 1
#!trydef ANTIFLOOD_AUTH_LIMIT_ENABLED 1
#!trydef ANTIFLOOD_RATE_DROP 1
#!trydef ANTIFLOOD_CACHE_PERIOD 3600
## each new ban of the same key doubles: 30s, 60s, 120s... BAN_MAX 0 = no ceiling
#!trydef ANTIFLOOD_FAILED_AUTH_BAN_BASE 30
#!trydef ANTIFLOOD_FAILED_AUTH_BAN_FACTOR 2
#!trydef ANTIFLOOD_FAILED_AUTH_BAN_MAX 0
#!trydef ANTIFLOOD_FAILED_AUTH_LEVEL_MEMORY 86400

#!substdef "!ANTIFLOOD_SUBST_CACHE_PERIOD!$def(ANTIFLOOD_CACHE_PERIOD)!g"
#!substdef "!ANTIFLOOD_SUBST_LEVEL_MEMORY!$def(ANTIFLOOD_FAILED_AUTH_LEVEL_MEMORY)!g"

######## Flood Prevention Hash Tables ########
modparam("htable", "htable", "antiflood=>size=16;autoexpire=ANTIFLOOD_SUBST_CACHE_PERIOD;initval=0")
## how many bans a user::ip[::port] got lately, for the progressive ban length;
## a successful authentication clears it
modparam("htable", "htable", "antiflood_level=>size=16;autoexpire=ANTIFLOOD_SUBST_LEVEL_MEMORY;initval=0")

######## Flood Prevention Module ########
loadmodule "pike.so"
modparam("pike", "sampling_time_unit", ANTIFLOOD_RATE_WINDOW)
modparam("pike", "reqs_density_per_unit", ANTIFLOOD_RATE_DENSITY)
modparam("pike", "remove_latency", ANTIFLOOD_RATE_EXPIRE)

kazoo.antiflood_failed_auth_use_port = ANTIFLOOD_FAILED_AUTH_USE_PORT descr "should we keep track of ip and port for auth failures"
kazoo.antiflood_failed_auth_action = ANTIFLOOD_FAILED_AUTH_ACTION descr "0 - log, 1 - drop, 2 - reply with 403"
kazoo.antiflood_rate_limit_enabled = ANTIFLOOD_RATE_LIMIT_ENABLED descr "antiflood rate limit enabled"
kazoo.antiflood_auth_limit_enabled = ANTIFLOOD_AUTH_LIMIT_ENABLED descr "antiflood auth limit enabled"
kazoo.antiflood_rate_drop = ANTIFLOOD_RATE_DROP descr "should we drop on rate limit"
kazoo.antiflood_failed_auth_ban_base = ANTIFLOOD_FAILED_AUTH_BAN_BASE descr "length in seconds of the first ban for auth failures"
kazoo.antiflood_failed_auth_ban_factor = ANTIFLOOD_FAILED_AUTH_BAN_FACTOR descr "each new ban of the same user::ip[::port] is this many times longer"
kazoo.antiflood_failed_auth_ban_max = ANTIFLOOD_FAILED_AUTH_BAN_MAX descr "longest ban in seconds for auth failures (0: no ceiling)"

route[ANTIFLOOD_RATE_LIMIT]
{
    if($sel(cfg_get.kazoo.antiflood_rate_limit_enabled) != 1) return;

    if (has_totag()
        || isflagset(FLAG_TRUSTED_SOURCE)
        || isflagset(FLAG_TRUSTED_PROXY)
        || isflagset(FLAG_TRUSTED_PARTNER)
        || isflagset(FLAG_INTERNALLY_SOURCED)) {
        return;
    }

    if (is_method("OPTIONS")) return;

    # use pike to control the rates
    if (!pike_check_req()) {
        if($sel(cfg_get.kazoo.antiflood_rate_drop) == 1) {
            xlog("L_WARN", "end - dropping request from $fu due to rate of requests with source $si:$sp\n");
            drop();
        } else {
            xlog("L_WARN", "request from $fu exceeded rate of requests with source $si:$sp\n");
        }
    }
}

route[ANTIFLOOD_AUTH_LIMIT]
{
    if($sel(cfg_get.kazoo.antiflood_auth_limit_enabled) != 1) return;

    if (has_totag()
        || isflagset(FLAG_TRUSTED_SOURCE)
        || isflagset(FLAG_TRUSTED_PROXY)
        || isflagset(FLAG_TRUSTED_PARTNER)
        || isflagset(FLAG_INTERNALLY_SOURCED)) {
        return;
    }

    if (is_method("OPTIONS")) return;

    $var(auth_key) = "";
    if($sel(cfg_get.kazoo.antiflood_failed_auth_use_port) == 1) {
        $var(auth_key) = $_s($Au::$si::$sp);
    } else {
        $var(auth_key) = $_s($Au::$si);
    }
    if ($Au != $null &&
        $sht(antiflood=>$var(auth_key)::count) >= ANTIFLOOD_FAILED_AUTH_DENSITY
    ) {
        # rolling ban: every refused request keeps it for the length of its level,
        # without a level up; the level is kept LEVEL_MEMORY past the new end
        $var(level) = $sht(antiflood_level=>$var(auth_key));
        route(KZ_ANTIFLOOD_BAN_EXPIRES);
        $shtex(antiflood=>$var(auth_key)::count) = $var(ban_expires);
        $shtex(antiflood_level=>$var(auth_key)) = $var(ban_expires) + ANTIFLOOD_FAILED_AUTH_LEVEL_MEMORY;
        $sht(antiflood=>$var(auth_key)::last) = $Ts;
        $var(refused) = $shtinc(antiflood=>$var(auth_key)::refused);
        $shtex(antiflood=>$var(auth_key)::refused) = $var(ban_expires) + ANTIFLOOD_FAILED_AUTH_LEVEL_MEMORY;
        xlog("L_INFO", "antiflood refused $var(refused) for $Au $si:$sp, ban $var(level) extended $var(ban_expires)s\n");
        if($sel(cfg_get.kazoo.antiflood_failed_auth_action) == 1) {
            xlog("L_WARNING", "end - dropping request authorization failure limit $def(ANTIFLOOD_FAILED_AUTH_DENSITY) for $Au $si:$sp\n");
            drop();
        } else if($sel(cfg_get.kazoo.antiflood_failed_auth_action) == 2) {
            xlog("L_NOTICE", "end - authorization failure limit $def(ANTIFLOOD_FAILED_AUTH_DENSITY) for $Au $si:$sp\n");
            append_to_reply("Retry-After: $var(ban_expires)\r\n");
            send_reply("403", "Forbidden");
            exit;
        } else {
            xlog("L_NOTICE", "authorization failure limit $def(ANTIFLOOD_FAILED_AUTH_DENSITY) for $Au $si:$sp\n");
        }
    }
}

route[KZ_AUTHORIZATION_SUCCESS_ANTIFLOOD_ROLE]
{
    if($sel(cfg_get.kazoo.antiflood_failed_auth_use_port) == 1) {
       sht_rm_name_re("antiflood=>^$(Au{re.subst,/\\./\\\\./g}{re.subst,/\\+/\\\\+/g})::$(si{re.subst,/\\./\\\\./g})::$sp::.*");
       $sht(antiflood_level=>$Au::$si::$sp) = $null;
    } else {
       sht_rm_name_re("antiflood=>^$(Au{re.subst,/\\./\\\\./g}{re.subst,/\\+/\\\\+/g})::$(si{re.subst,/\\./\\\\./g})::.*");
       $sht(antiflood_level=>$Au::$si) = $null;
    }
}

route[REGISTRAR_REG_FLUSH_ANTIFLOOD_ROLE]
{
    if ($(kzE{kz.json,Username}) == "") {
        # a flush of the whole realm: every user of it
        $var(user) = "[^@]+@" + $(kzE{kz.json,Realm});
    } else {
        $var(user) = $(kzE{kz.json,Username}) + "@" + $(kzE{kz.json,Realm});
    }
    sht_rm_name_re("antiflood=>^$(var(user){re.subst,/\\./\\\\./g})::.*");
    sht_rm_name_re("antiflood_level=>^$(var(user){re.subst,/\\./\\\\./g})::.*");
}

## $var(ban_expires) = the ban length for $var(level):
## base * factor^(level - 1), never above max (0: no ceiling). Integers on purpose: $sel gives
## strings, and $shtex ignores a string expire. Not ANTIFLOOD_* named, since
## routes(ANTIFLOOD) runs every route with that prefix on each request.
route[KZ_ANTIFLOOD_BAN_EXPIRES]
{
    $var(ban_expires) = $(sel(cfg_get.kazoo.antiflood_failed_auth_ban_base){s.int});
    $var(ban_factor) = $(sel(cfg_get.kazoo.antiflood_failed_auth_ban_factor){s.int});
    $var(ban_max) = $(sel(cfg_get.kazoo.antiflood_failed_auth_ban_max){s.int});
    # without a ceiling the doubling still stops near 30 years, so the int
    # (and ban + LEVEL_MEMORY) never wraps around
    $var(i) = 1;
    while ($var(i) < $var(level) && $var(ban_expires) < 1000000000
           && ($var(ban_max) == 0 || $var(ban_expires) < $var(ban_max))) {
        $var(ban_expires) = $var(ban_expires) * $var(ban_factor);
        $var(i) = $var(i) + 1;
    }
    if ($var(ban_max) > 0 && $var(ban_expires) > $var(ban_max)) {
        $var(ban_expires) = $var(ban_max);
    }
}

route[KZ_AUTHORIZATION_FAILED_AUTH_ANTIFLOOD_ROLE]
{
    if($sel(cfg_get.kazoo.antiflood_auth_limit_enabled) != 1) return;

    if (isflagset(FLAG_TRUSTED_SOURCE)) {
        return;
    }

    $var(auth_key) = "";
    if($sel(cfg_get.kazoo.antiflood_failed_auth_use_port) == 1) {
        $var(auth_key) = $_s($Au::$si::$sp);
    } else {
        $var(auth_key) = $_s($Au::$si);
    }

    # the previous failure, read before this one overwrites it
    $var(last) = $sht(antiflood=>$var(auth_key)::last);
    $var(count) = $shtinc(antiflood=>$var(auth_key)::count);
    $sht(antiflood=>$var(auth_key)::last) = $Ts;

    xlog("L_INFO", "$var(count) errounous authorization response for $Au $si:$sp\n");

    # a key whose level is still remembered (antiflood_level, LEVEL_MEMORY past
    # its last ban) is banned again at its first failure; otherwise DENSITY
    # failures within the window
    $var(level) = $sht(antiflood_level=>$var(auth_key));
    $var(exp) = $Ts - ANTIFLOOD_FAILED_AUTH_WINDOW;
    if ($var(level) > 0 ||
        ($var(count) >= ANTIFLOOD_FAILED_AUTH_DENSITY && $var(last) > $var(exp))
    ) {
        # a new ban: one level up, and it lasts that level's length; the count
        # goes to the limit, which is what ANTIFLOOD_AUTH_LIMIT refuses on
        $var(level) = $shtinc(antiflood_level=>$var(auth_key));
        route(KZ_ANTIFLOOD_BAN_EXPIRES);
        $sht(antiflood=>$var(auth_key)::count) = ANTIFLOOD_FAILED_AUTH_DENSITY;
        $shtex(antiflood=>$var(auth_key)::count) = $var(ban_expires);
        $shtex(antiflood_level=>$var(auth_key)) = $var(ban_expires) + ANTIFLOOD_FAILED_AUTH_LEVEL_MEMORY;
        xlog("L_NOTICE", "end - request at authorization failure limit $def(ANTIFLOOD_FAILED_AUTH_DENSITY) for $Au $si:$sp\n");
        xlog("L_NOTICE", "antiflood ban $var(level) for $Au $si:$sp lasts $var(ban_expires)s\n");
        append_to_reply("Retry-After: $var(ban_expires)\r\n");
        send_reply("403", "Forbidden");
        exit;
    }
}

event_route[htable:expired:antiflood]
{
    xlog("L_NOTICE", "antiflood expired record $shtrecord(key) => $shtrecord(value)\n");
}
